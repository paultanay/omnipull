version: "3.9"

# OmniPull Docker Compose
# Runs: Redis + FastAPI web server
# The Celery worker runs on the HOST (not in Docker) so it can
# access your browser cookies automatically for YouTube downloads.
# Use start.ps1 (Windows) or start.sh (Linux/Mac) to start everything.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    working_dir: /app/backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:379/0
      - TMP_DIR=/tmp/omnipull
    volumes:
      - tmp_downloads:/tmp/omnipull
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tmp_downloads:
