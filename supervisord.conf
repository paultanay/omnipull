[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:web]
command=uvicorn main:app --host 0.0.0.0 --port %(ENV_PORT)s --workers 1
directory=/app/backend
environment=REDIS_URL="%(ENV_REDIS_URL)s",TMP_DIR="/tmp/omnipull"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:worker]
command=celery -A celery_app worker --loglevel=info --concurrency=2 --queues=celery
directory=/app/backend
environment=REDIS_URL="%(ENV_REDIS_URL)s",TMP_DIR="/tmp/omnipull"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
